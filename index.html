<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var isExtensionSource = function (src) {
          return typeof src === 'string' && src.indexOf('chrome-extension://') === 0;
        };
        var isExtensionStack = function (err) {
          return Boolean(err && typeof err.stack === 'string' && err.stack.indexOf('chrome-extension://') !== -1);
        };
        window.addEventListener(
          'error',
          function (event) {
            if (isExtensionSource(event.filename) || isExtensionStack(event.error)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true,
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (isExtensionStack(event.reason)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true,
        );
      })();
    </script>
    <title>Portal Administrasi GPAI — Portofolio & Dokumen Guru</title>
